name: Update leaderboard

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 11:00 UTC = 7:00 AM Puerto Rico
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build page
        env:
          COMPETITORS_JSON: ${{ secrets.COMPETITORS_JSON }}
          # Optional repo variable; set it when a new season starts.
          PERIOD: ${{ vars.LEADERBOARD_PERIOD }}
        run: |
          if [ -z "$COMPETITORS_JSON" ]; then
            echo "::error::Repository secret COMPETITORS_JSON is not set."
            exit 1
          fi
          python pr_leaderboard.py --quiet --no-save --html site/index.html ${PERIOD:+--period "$PERIOD"}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
